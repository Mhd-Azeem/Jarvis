name: Build Jarvis Android

on:
  push:
    branches: [ main, az-jarvis-core ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing Android signing material
        uses: actions/cache/restore@v4
        with:
          path: .signing
          key: jarvis-android-signing-v1
      - name: Verify signing continuity
        shell: bash
        run: |
          test -s .signing/jarvis-release.jks || { echo 'Existing Android signing key is unavailable. Refusing to create an incompatible replacement.'; exit 1; }
          test -s .signing/signing.env || { echo 'Existing signing credentials are unavailable.'; exit 1; }
      - name: Build signed Android release APK
        shell: bash
        run: |
          set -a
          source .signing/signing.env
          set +a
          export JARVIS_KEYSTORE_PATH="${GITHUB_WORKSPACE}/.signing/jarvis-release.jks"
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - name: Prepare and verify Android APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk Jarvis-Android.apk
          test -s Jarvis-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Jarvis-Android.apk
      - name: Verify update certificate matches latest published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir previous
          old_apk="$(find previous -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$old_apk"
          old_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$old_apk" | awk -F ': ' '/certificate SHA-256 digest/ {print $2; exit}')"
          new_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs Jarvis-Android.apk | awk -F ': ' '/certificate SHA-256 digest/ {print $2; exit}')"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android
          path: Jarvis-Android.apk
          if-no-files-found: error

  release:
    name: Publish Android release
    needs: [android]
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/az-jarvis-core') && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-android
          path: release
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release/Jarvis-Android.apk
          gh release create "build-${{ github.run_number }}" release/Jarvis-Android.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Jarvis Android Preview #${{ github.run_number }}" --notes "Android development preview. Signed with the existing Jarvis update key. Android installation requires system confirmation. Offline Hey Jarvis still needs a Nubia V70 Max microphone test. Tasks, calendar, agents, and Tamil/Sinhala speech remain incomplete. Windows work is paused; this release contains Android only."
